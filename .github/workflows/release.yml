name: Make_Release

on:
  workflow_dispatch:

jobs:
  build:
    name: "Build and Release"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          sudo apt-get -y install libxml2-dev libxslt-dev libxslt1-dev python3-dev python3-lxml
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt

      - name: Build
        run: |
          ./build.sh

      - name: Create a PR in case submodules have updated
        uses: peter-evans/create-pull-request@v8

      - name: "Determine tag"
        run: |
          # Sort by version, not by commit date. `git rev-list --tags
          # --max-count=1` returns the most recently *committed* tagged commit,
          # which is not necessarily the highest version: v1.27 was tagged on a
          # newer commit than v1.28, so the old logic returned v1.27 and built a
          # v1.28 that collided with the existing tag.
          last_tag=$(git tag --sort=-v:refname | head -n 1)
          next_tag="${last_tag%.*}.$((${last_tag##*.}+1))"
          echo "RELEASE_TAG=$next_tag" >> $GITHUB_ENV

      - name: "Create incremental release"
        uses: "actions/github-script@v9"
        with:
          script: |
            const fs = require('fs');

            try {
              const release = await github.rest.repos.createRelease({
                draft: true,
                generate_release_notes: true,
                name: process.env.RELEASE_TAG,
                owner: context.repo.owner,
                prerelease: true,
                repo: context.repo.repo,
                tag_name: process.env.RELEASE_TAG,
              });
              await github.request({
                method: 'POST',
                url: release.data.upload_url,
                headers: {
                  "content-type": "application/zip",
                },
                data: fs.readFileSync("downloads.zip"),
                name: 'downloads.zip',
              });
              await github.request({
                method: 'POST',
                url: release.data.upload_url,
                headers: {
                  "content-type": "application/zip",
                },
                data: fs.readFileSync("output.zip"),
                name: 'output.zip',
              });
            } catch (error) {
              core.error(error.message);
              core.setFailed(error.message);
            }
